<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digura · Cihaz vitrini (Karşılama, Kilit, Harita)</title>
<style>
  :root {
    --bg: #f8fafd;
    --surface: #ffffff;
    --surface-warm: #e8f0fe;
    --fg: #202124;
    --fg-2: #3c4043;
    --muted: #5f6368;
    --meta: #1a73e8;
    --border: #dadce0;
    --border-soft: #edf0f2;
    --accent: #1a73e8;
    --accent-on: #ffffff;
    --success: #188038;
    --warn: #f9ab00;
    --danger: #d93025;
    --font-display: "Google Sans", Roboto, Arial, sans-serif;
    --font-body: Roboto, Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, Menlo, monospace;
    --text-xs: 12px;
    --text-sm: 14px;
    --text-base: 16px;
    --text-lg: 18px;
    --text-xl: 24px;
    --text-2xl: 32px;
    --leading-body: 1.5;
    --leading-tight: 1.12;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --radius-md: 12px;
    --radius-lg: 24px;
    --radius-pill: 9999px;
    --elev-raised: 0 3px 8px rgba(60, 64, 67, 0.18);
    --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  }
  /* Digura duygu renkleri (uygulamayla aynı) */
  :root {
    --m-joyful: oklch(85% 0.16 90);
    --m-calmSad: oklch(54% 0.15 252);
    --m-angryStressed: oklch(57% 0.2 25);
    --m-serene: oklch(70% 0.14 155);
    --m-tired: oklch(68% 0.012 260);
    --empty: oklch(94.5% 0.004 255);
    --key: oklch(95% 0.004 255);
  }
  .theme-dark {
    --bg: oklch(15.5% 0.007 255);
    --surface: oklch(19% 0.008 255);
    --surface-warm: oklch(28% 0.04 255);
    --fg: oklch(94% 0.004 255);
    --fg-2: oklch(86% 0.006 255);
    --muted: oklch(72% 0.01 255);
    --border: oklch(36% 0.01 255);
    --border-soft: oklch(26% 0.009 255);
    --accent: oklch(76% 0.12 255);
    --accent-on: oklch(18% 0.03 255);
    --empty: oklch(26% 0.009 255);
    --key: oklch(26% 0.009 255);
    --m-joyful: oklch(84% 0.15 90);
    --m-calmSad: oklch(70% 0.13 250);
    --m-angryStressed: oklch(68% 0.17 25);
    --m-serene: oklch(73% 0.12 155);
    --m-tired: oklch(62% 0.012 260);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: oklch(11% 0.006 285); }
  body { font-family: var(--font-body); }

  /* ─── 1920×1080 sahne ─── */
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--fit, 1)); overflow: hidden;
    background: radial-gradient(ellipse 80% 70% at 50% 38%, oklch(22% 0.01 285) 0%, oklch(13% 0.008 285) 55%, oklch(9% 0.006 285) 100%); color: oklch(92% 0.004 285); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(to bottom, transparent, oklch(7% 0.005 285 / 0.8) 90%); pointer-events: none; z-index: 0; }
  .caption, .row, .slug { z-index: 2; }
  .floor::before { content: ''; position: absolute; left: 8%; right: 8%; top: 0; height: 1px; background: linear-gradient(to right, transparent, oklch(100% 0 0 / 0.16), transparent); }
  .lens { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(ellipse, oklch(100% 0 0 / 0.16) 0%, transparent 62%); }
  .lens.a { width: 900px; height: 360px; left: 90px; top: -150px; }
  .lens.b { width: 700px; height: 280px; right: 40px; top: -110px; opacity: .7; }
  .lens.c { width: 420px; height: 420px; left: 750px; top: 240px; opacity: .35; }

  .caption { position: absolute; left: 96px; top: 64px; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(100% 0 0 / 0.6); line-height: 1.8; }
  .caption b { color: oklch(100% 0 0 / 0.92); font-weight: 500; }
  .slug { position: absolute; right: 96px; top: 56px; text-align: right; }
  .slug .logo { display: inline-flex; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 500; font-size: 44px; letter-spacing: -0.01em; line-height: 1; }
  .slug .logo i { width: 32px; height: 32px; border-radius: 50%; background: conic-gradient(var(--m-joyful) 0 20%, var(--m-calmSad) 0 40%, var(--m-angryStressed) 0 60%, var(--m-serene) 0 80%, var(--m-tired) 0); }
  .slug p { margin: 10px 0 0; font-size: 18px; color: oklch(100% 0 0 / 0.7); }
  .slug hr { border: 0; height: 1px; margin: 10px 0 0 auto; width: 200px; background: oklch(100% 0 0 / 0.22); }
  .slug small { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(100% 0 0 / 0.5); }

  /* ─── 3B sahne ─── */
  .row { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; gap: 72px; }
  .col { width: 312px; display: flex; flex-direction: column; align-items: center; gap: 18px; perspective: 2400px; }
  .tag { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(100% 0 0 / 0.7); white-space: nowrap; }
  .tag b { color: oklch(100% 0 0 / 0.95); font-weight: 500; margin-right: 8px; }
  .unit { position: relative; width: 312px; height: 675px; transform-style: preserve-3d; transform: rotateY(var(--b)) rotateX(4deg);
    animation: turn 8s ease-in-out infinite alternate; }
  .unit:nth-child(2) { animation-delay: -2.6s; }
  @keyframes turn { from { transform: rotateY(calc(var(--b) - 7deg)) rotateX(4deg); } to { transform: rotateY(calc(var(--b) + 7deg)) rotateX(4deg); } }
  .spinner { position: absolute; left: 0; top: 0; width: 312px; height: 675px; transform-style: preserve-3d; }
  .spinner .phone { position: absolute; left: 0; top: 0; transform: scale(0.8); transform-origin: top left; backface-visibility: hidden; }
  .spinner.turn { animation: spin 900ms ease-in-out both; animation-delay: var(--d, 0ms); }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  /* arka yüz: titanyum panel + kamera çıkıntısı (yalnızca dönüş sırasında görünür) */
  .back { position: absolute; left: 0; top: 0; width: 312px; height: 675px; border-radius: 45px; transform: rotateY(180deg); backface-visibility: hidden;
    background: linear-gradient(145deg, oklch(82% 0.004 285), oklch(63% 0.005 285) 42%, oklch(76% 0.004 285) 70%, oklch(58% 0.005 285)); box-shadow: inset 0 0 0 1.5px oklch(100% 0 0 / 0.55); }
  .back .cam { position: absolute; right: 22px; top: 22px; width: 104px; height: 104px; border-radius: 28px; background: linear-gradient(145deg, oklch(70% 0.004 285), oklch(55% 0.005 285)); box-shadow: inset 0 0 0 1.5px oklch(100% 0 0 / 0.4); }
  .back .cam i { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, oklch(34% 0.02 265), oklch(9% 0 0) 70%); box-shadow: 0 0 0 3px oklch(46% 0.004 285), 0 0 0 4.5px oklch(78% 0.004 285); }
  .back .cam i:nth-child(1) { left: 10px; top: 10px; } .back .cam i:nth-child(2) { left: 10px; top: 56px; } .back .cam i:nth-child(3) { left: 56px; top: 33px; }
  .unit .refl { position: absolute; left: 0; top: 695px; width: 312px; height: 675px; transform: scaleY(-1); opacity: .34; pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, oklch(0% 0 0 / 0.9), transparent 25%); mask-image: linear-gradient(to top, oklch(0% 0 0 / 0.9), transparent 25%); }
  .unit .refl .spinner .phone { backface-visibility: visible; }
  .unit .refl .phone { animation: none; }
  .unit .shadow { position: absolute; left: 6%; right: 6%; top: 676px; height: 28px; background: radial-gradient(ellipse, oklch(0% 0 0 / 0.6), transparent 70%); filter: blur(6px); }

  /* ─── iPhone 15 Pro (CSS ile çizilmiş titanyum) ─── */
  .phone { position: relative; width: 390px; height: 844px; padding: 12px; border-radius: 56px;
    background: linear-gradient(145deg, oklch(82% 0.004 285), oklch(63% 0.005 285) 42%, oklch(76% 0.004 285) 70%, oklch(58% 0.005 285));
    box-shadow: inset 0 0 0 1.5px oklch(100% 0 0 / 0.55), inset 0 0 0 5px oklch(14% 0 0), 0 30px 60px -20px oklch(0% 0 0 / 0.7); }
  .rail { position: absolute; width: 5px; border-radius: 3px; background: linear-gradient(to bottom, oklch(70% 0.004 285), oklch(52% 0.005 285)); }
  .rail.l1 { left: -4px; top: 174px; height: 32px; } .rail.l2 { left: -4px; top: 222px; height: 62px; } .rail.l3 { left: -4px; top: 296px; height: 62px; } .rail.r1 { right: -4px; top: 252px; height: 104px; }
  .island { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 999px; background: oklch(5% 0 0); z-index: 6; }
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 44px; background: var(--surface); color: var(--fg); display: flex; flex-direction: column; font-size: 16px; line-height: 1.5; }
  .glare { position: absolute; inset: 0; z-index: 7; pointer-events: none; border-radius: inherit; background: linear-gradient(115deg, oklch(100% 0 0 / 0.16) 0%, oklch(100% 0 0 / 0.03) 26%, transparent 40%); }
  .statusbar { flex: 0 0 47px; padding: 18px 26px 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .statusbar .r { display: inline-flex; align-items: center; gap: 6px; }
  .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
  .statusbar .batt { width: 25px; }
  .home { flex: 0 0 22px; position: relative; }
  .home::after { content: ''; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 999px; background: var(--fg); opacity: .85; }
  .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ekran ortak */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px 0 20px; min-height: 48px; }
  .wordmark { font-family: var(--font-display); font-weight: 500; font-size: 18px; display: inline-flex; align-items: center; gap: 8px; }
  .wordmark i { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--m-joyful) 0 20%, var(--m-calmSad) 0 40%, var(--m-angryStressed) 0 60%, var(--m-serene) 0 80%, var(--m-tired) 0); }
  .tbtn { padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--fg-2); }
  .btn { display: grid; place-items: center; min-height: 52px; border-radius: 999px; background: var(--accent); color: var(--accent-on); font-weight: 500; letter-spacing: .02em; }

  /* 1 · karşılama */
  .ob { flex: 1; display: flex; flex-direction: column; padding: 0 24px; }
  .hero { flex: 1; display: grid; place-items: center; }
  .palette { position: relative; width: 300px; height: 300px; }
  .palette .core { position: absolute; inset: 82px; border-radius: 50%; background: var(--m-serene); box-shadow: 0 24px 50px -20px var(--m-serene); display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; font-size: 18px; color: oklch(22% 0.05 155); }
  .palette b { position: absolute; width: 56px; height: 56px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--mc); }
  .palette b.on { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--fg); }
  .copy { padding-bottom: 20px; }
  .copy h2 { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; margin: 0 0 12px; }
  .copy p { margin: 0; color: var(--fg-2); font-size: 15px; }
  .foot { padding: 8px 24px 16px; display: grid; gap: 16px; }
  .dots { display: flex; justify-content: center; gap: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 999px; background: var(--border); }
  .dots i.on { width: 24px; background: var(--fg); }

  /* 2 · kilit */
  .lk { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 24px; text-align: center; }
  .lk .badge { margin-top: 18px; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-warm); color: var(--accent); }
  .lk .badge .ico { width: 28px; height: 28px; }
  .lk h2 { font-family: var(--font-display); font-weight: 500; font-size: 26px; margin: 18px 0 6px; }
  .lk p { margin: 0; color: var(--fg-2); font-size: 15px; max-width: 28ch; }
  .pin { display: flex; gap: 20px; margin: 26px 0 28px; }
  .pin i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fg-2); }
  .pin i.on { background: var(--fg); border-color: var(--fg); }
  .keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 22px; }
  .key { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--key); font-family: var(--font-display); font-size: 28px; }
  .key.ghost { background: transparent; }
  .key .ico { width: 30px; height: 30px; }
  .forgot { margin-top: 16px; padding: 12px 16px; font-size: 14px; font-weight: 500; color: var(--accent); }

  /* 3 · harita */
  .mp { flex: 1; min-height: 0; padding-top: 4px; }
  .mp .head { padding: 8px 20px 14px; }
  .mp .hint { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .mp h1 { font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.1; letter-spacing: -0.01em; margin: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; margin: 0 20px 14px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
  .seg span { min-height: 40px; display: grid; place-items: center; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .seg span.on { background: var(--border-soft); color: var(--fg); font-weight: 600; }
  .mnav { padding: 0 20px; margin-bottom: 10px; }
  .mnav b { font-family: var(--font-display); font-weight: 500; font-size: 20px; display: block; }
  .mnav small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .wk, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 12px; }
  .wk { padding-bottom: 6px; } .wk span { text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .cell { aspect-ratio: 1; border-radius: 11px; padding: 5px 6px; position: relative; background: var(--empty); color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
  .cell.has { background: var(--mc); color: var(--on); }
  .cell.blank { background: transparent; }
  .cell.future { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
  .cell.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .cell .ico { position: absolute; right: 5px; bottom: 5px; width: 11px; height: 11px; stroke-width: 2.2; opacity: .75; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 16px 20px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend i { width: 12px; height: 12px; border-radius: 4px; background: var(--mc); }
  .note { display: flex; gap: 8px; align-items: flex-start; margin: 18px 20px 0; font-size: 13px; color: var(--muted); }
  .note .ico { width: 16px; height: 16px; margin-top: 1px; }
  .navbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 8px 4px; background: var(--surface); border-top: 1px solid var(--border); }
  .nav { display: grid; justify-items: center; gap: 4px; min-height: 60px; font-size: 12px; color: var(--muted); }
  .nav .ind { width: 64px; height: 32px; border-radius: 999px; display: grid; place-items: center; }
  .nav.on { color: var(--fg); font-weight: 500; } .nav.on .ind { background: var(--surface-warm); }
  .nav .ico { width: 22px; height: 22px; }

  /* tema seçici */
  .picker { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 18px; }
  .picker .lbl { display: block; margin: 0; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(100% 0 0 / 0.55); }
  .picker .seg { display: inline-flex; padding: 4px; gap: 4px; border: 1px solid oklch(100% 0 0 / 0.22); border-radius: 999px; background: oklch(100% 0 0 / 0.05); }
  .picker button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: transparent; color: oklch(100% 0 0 / 0.82); font: 500 16px var(--font-body); cursor: pointer; transition: background-color 160ms var(--ease-standard), color 160ms var(--ease-standard); }
  .picker button:hover { background: oklch(100% 0 0 / 0.14); color: oklch(100% 0 0 / 0.95); }
  .picker button[aria-pressed="true"] { background: oklch(96% 0.004 285); color: oklch(15% 0.006 285); }
  .picker button:focus-visible { outline: none; box-shadow: 0 0 0 3px oklch(76% 0.12 255 / 0.7); }

  /* koyu temada duygu rengi üstündeki yazı/simge */
  .theme-dark .palette .core, .theme-dark .cell.has, .theme-dark .orb, .theme-dark .swc .dot { color: oklch(18% 0.02 255); }

  /* 3 · Bugün */
  .orbw { display: grid; justify-items: center; padding: 6px 0 10px; }
  .orb { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; background: var(--mc); box-shadow: 0 18px 40px -16px var(--mc); color: var(--on); }
  .orb .ico { width: 30px; height: 30px; stroke-width: 2.4; }
  .olabel { margin: 12px 0 0; font-family: var(--font-display); font-weight: 500; font-size: 20px; line-height: 1.3; }
  .osub { margin: 2px 0 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .sw5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 12px; margin-top: 6px; }
  .swc { display: grid; justify-items: center; gap: 6px; padding: 4px 0; }
  .swc .dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--mc); color: var(--on); }
  .swc .dot.sel { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--fg); }
  .swc .dot .ico { width: 22px; height: 22px; stroke-width: 2.6; }
  .swc .lbl { font-size: 12px; line-height: 1.2; color: var(--muted); text-align: center; min-height: 29px; }
  .swc .lbl.on { color: var(--fg); font-weight: 500; }
  .notef { margin: 16px 20px 0; padding: 10px 14px 8px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); }
  .notef label { display: block; font-size: 12px; color: var(--muted); }
  .notef p { margin: 4px 0 0; font-size: 16px; line-height: 1.4; }
  .notef .nf { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .notef .nf span:first-child { display: inline-flex; align-items: center; gap: 5px; } .notef .nf .ico { width: 14px; height: 14px; }
  .saverow { padding: 16px 20px 0; }

  @media (prefers-reduced-motion: reduce) { .unit { animation: none; } .spinner.turn { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage" data-od-id="showcase-stage">
  <div class="lens a"></div><div class="lens b"></div><div class="lens c"></div>

  <div class="caption" data-od-id="showcase-caption"><b>Digura</b> · Duygu Haritası &amp; Dijital Zaman Kapsülü<br>Flutter MVP · Android ve iOS · 25 Ekim 2026</div>

  <div class="row" id="row" data-od-id="device-row">
    <div class="col" data-od-id="device-onboarding"><div class="tag"><b>01</b>Karşılama</div>
      <div class="unit" style="--b:18deg" role="img" aria-label="iPhone ekranında Digura karşılama: Her gün tek bir renk, beş duygu rengi halkası ve Devam düğmesi" data-screen="onboarding"></div></div>
    <div class="col" data-od-id="device-lock"><div class="tag"><b>02</b>Kilit</div>
      <div class="unit" style="--b:6deg" role="img" aria-label="iPhone ekranında Digura kilit ekranı: PIN noktaları, tuş takımı ve parmak izi tuşu" data-screen="lock"></div></div>
    <div class="col" data-od-id="device-today"><div class="tag"><b>03</b>Bugün</div>
      <div class="unit" style="--b:-6deg" role="img" aria-label="iPhone ekranında Digura Bugün ekranı: Dingin rengi seçili, tek cümlelik not ve Rengi kaydet düğmesi" data-screen="today"></div></div>
    <div class="col" data-od-id="device-map"><div class="tag"><b>04</b>Harita</div>
      <div class="unit" style="--b:-18deg" role="img" aria-label="iPhone ekranında Digura renk haritası: Ekim 2026 ay görünümü, kilitli günler ve alt menü" data-screen="map"></div></div>
  </div>

  <div class="picker" data-od-id="theme-picker"><span class="lbl" id="pk-lbl">Tema</span>
    <div class="seg" role="group" aria-labelledby="pk-lbl">
      <button type="button" data-mode="light" aria-pressed="true">Açık</button>
      <button type="button" data-mode="dark" aria-pressed="false">Koyu</button>
    </div></div>

  <div class="slug" data-od-id="product-slug"><span class="logo"><i></i>Digura</span><p>Günde bir renk. Notlar 30 gün kilitli.</p></div>
  <div class="floor"></div>
</div>

<script>
(() => {
  const ST = `<div class="statusbar"><span>9:41</span><span class="r">
    <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
    <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
    <svg class="batt" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg></span></div>`;
  const IC = {
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    fp: '<path d="M12 11v3.5a6 6 0 0 1-1.2 3.6"/><path d="M8.5 10.5a3.5 3.5 0 0 1 7 0V13a10 10 0 0 1-.6 3.5"/><path d="M5.5 9.5a6.5 6.5 0 0 1 13 0V12M5.5 13v-1M7 19.5a9 9 0 0 0 1.5-4.5"/><path d="M17.5 18.5c.4-.9.7-1.9.9-3"/>',
    del: '<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m13 9 4 6M17 9l-4 6"/>',
    sun: '<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  };
  const ic = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
  const MOODS = ['joyful', 'calmSad', 'angryStressed', 'serene', 'tired'];
  const LABEL = { joyful: 'Neşeli', calmSad: 'Sakin / Hüzünlü', angryStressed: 'Öfkeli / Stresli', serene: 'Dingin', tired: 'Yorgun' };
  const ON = { joyful: 'oklch(26% 0.05 80)', calmSad: 'oklch(99% 0 0)', angryStressed: 'oklch(99% 0 0)', serene: 'oklch(22% 0.05 155)', tired: 'oklch(20% 0.01 260)' };

  /* 1 · karşılama (açık tema) */
  const onboarding = () => {
    const ring = MOODS.map((id, i) => { const a = (-90 + i * 72) * Math.PI / 180; return `<b class="${id === 'serene' ? 'on' : ''}" style="left:${150 + Math.cos(a) * 122}px;top:${150 + Math.sin(a) * 122}px;--mc:var(--m-${id})"></b>`; }).join('');
    return `${ST}<div class="topbar"><span class="wordmark"><i></i>Digura</span><span class="tbtn">Atla</span></div>
      <div class="ob"><div class="hero"><div class="palette">${ring}<div class="core">Dingin</div></div></div>
        <div class="copy"><h2>Her gün tek bir renk.</h2><p>Gününü beş duygu renginden biriyle ve en fazla 140 karakterlik tek bir cümleyle kaydet. Denemek için bir renge dokun.</p></div></div>
      <div class="foot"><div class="dots"><i class="on"></i><i></i><i></i></div><div class="btn">Devam</div></div><div class="home"></div>`;
  };

  /* 2 · kilit (koyu tema) */
  const lock = () => {
    const keys = ['1','2','3','4','5','6','7','8','9'].map(k => `<div class="key">${k}</div>`).join('') + `<div class="key ghost">${ic('fp')}</div><div class="key">0</div><div class="key ghost">${ic('del')}</div>`;
    return `${ST}<div class="lk"><div class="badge">${ic('lock')}</div><h2>Kilidi aç</h2><p>PIN'ini gir ya da parmak izini kullan</p>
      <div class="pin"><i class="on"></i><i class="on"></i><i></i><i></i></div><div class="keys">${keys}</div><div class="forgot">PIN'imi unuttum</div></div><div class="home"></div>`;
  };

  /* 3 · harita (açık tema) — prototipteki örnek verinin aynı üretimi */
  const DAY = 86400000, TODAY = Date.UTC(2026, 9, 25);
  function seed() {
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const w = [['joyful', .26], ['serene', .24], ['calmSad', .18], ['tired', .18], ['angryStressed', .14]], out = {};
    for (let t = Date.UTC(2026, 7, 1); t < TODAY; t += DAY) {
      if (rnd() < .16) continue;
      let r = rnd(), mood = 'joyful'; for (const [id, p] of w) { if ((r -= p) <= 0) { mood = id; break; } }
      if (rnd() >= .12) rnd();  /* prototipteki not seçimiyle aynı rastgele akış */
      out[t] = mood;
    }
    return out;
  }
  const map = () => {
    const E = seed(), y = 2026, m = 9, lead = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7, n = 31;
    let count = 0, cells = '<span class="cell blank"></span>'.repeat(lead);
    for (let d = 1; d <= n; d++) {
      const t = Date.UTC(y, m, d), mood = E[t], today = t === TODAY ? ' today' : '';
      if (mood) { count++; cells += `<span class="cell has${today}" style="--mc:var(--m-${mood});--on:${ON[mood]}">${d}${ic('lock')}</span>`; }
      else cells += `<span class="cell${t > TODAY ? ' future' : ''}${today}">${d}</span>`;
    }
    const nav = [['Bugün', 'sun'], ['Harita', 'grid'], ['İstatistik', 'chart']].map(([l, i]) => `<div class="nav${l === 'Harita' ? ' on' : ''}"><span class="ind">${ic(i)}</span>${l}</div>`).join('');
    return `${ST}<div class="mp"><div class="head"><p class="hint">Renk haritası</p><h1>Harita</h1></div>
      <div class="seg"><span class="on">Ay</span><span>Yıl</span></div>
      <div class="mnav"><b>Ekim 2026</b><small>${count} / ${n} gün renklendi</small></div>
      <div class="wk">${['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(w => `<span>${w}</span>`).join('')}</div><div class="cal">${cells}</div>
      <div class="legend">${MOODS.map(id => `<span style="--mc:var(--m-${id})"><i></i>${LABEL[id]}</span>`).join('')}</div>
      <p class="note">${ic('lock')}<span>Kilit simgeli günlerin notları, kayıttan 30 gün sonra açılır. Bir güne dokunarak kapsülü gör.</span></p></div>
      <div class="navbar">${nav}</div><div class="home" style="background:var(--surface)"></div>`;
  };

  /* 3 · Bugün */
  const navHTML = on => `<div class="navbar">${[['Bugün', 'sun'], ['Harita', 'grid'], ['İstatistik', 'chart']].map(([l, i]) => `<div class="nav${l === on ? ' on' : ''}"><span class="ind">${ic(i)}</span>${l}</div>`).join('')}</div>`;
  const today = () => `${ST}<div class="mp"><div class="head"><p class="hint">25 Ekim 2026 · Pazar</p><h1>Bugün nasıldın?</h1></div>
    <div class="orbw" style="--mc:var(--m-serene);--on:${ON.serene}"><div class="orb">${ic('check')}</div><p class="olabel">${LABEL.serene}</p><p class="osub">Seçilen duygu</p></div>
    <div class="sw5">${MOODS.map(id => `<div class="swc" style="--mc:var(--m-${id});--on:${ON[id]}"><span class="dot${id === 'serene' ? ' sel' : ''}">${id === 'serene' ? ic('check') : ''}</span><span class="lbl${id === 'serene' ? ' on' : ''}">${LABEL[id].replace(' / ', ' /<br>')}</span></div>`).join('')}</div>
    <div class="notef"><label>Tek cümlelik not · isteğe bağlı</label><p>Telefonu bırakıp parkta kitap okudum.</p><div class="nf"><span>${ic('lock')} 30 gün kilitli kalır</span><span>37/140</span></div></div>
    <div class="saverow"><div class="btn">Rengi kaydet</div></div></div>${navHTML('Bugün')}<div class="home" style="background:var(--surface)"></div>`;

  /* tema: açık ya da koyu */
  const SCREENS = { onboarding: onboarding, lock: lock, today: today, map: map };
  const MODES = { light: {}, dark: { onboarding: true, lock: true, today: true, map: true } };
  const isDark = (mode, name) => !!MODES[mode][name];
  const phone = html => `<div class="phone" aria-hidden="true"><span class="rail l1"></span><span class="rail l2"></span><span class="rail l3"></span><span class="rail r1"></span><span class="island"></span>
    <div class="screen" inert>${html}</div><div class="glare"></div></div>`;
  const spinner = html => `<div class="spinner">${phone(html)}<div class="back" aria-hidden="true"><div class="cam"><i></i><i></i><i></i></div></div></div>`;
  const KEY = 'digura.vitrin.tema';
  let mode = 'light'; try { const m = localStorage.getItem(KEY); if (MODES[m]) mode = m; } catch (e) {}
  const units = [...document.querySelectorAll('.unit')];
  units.forEach(u => {
    const html = SCREENS[u.dataset.screen]();
    u.innerHTML = `${spinner(html)}<div class="shadow" aria-hidden="true"></div><div class="refl" aria-hidden="true">${spinner(html)}</div>`;
  });
  const setDark = (u, d) => u.querySelectorAll('.screen').forEach(sc => sc.classList.toggle('theme-dark', d));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const buttons = [...document.querySelectorAll('.picker button')];
  const mark = () => buttons.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  units.forEach(u => setDark(u, isDark(mode, u.dataset.screen))); mark();

  /* seçim: telefonlar sırayla tam tur döner, tema ekran arka yüzdeyken değişir */
  buttons.forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode; try { localStorage.setItem(KEY, mode); } catch (e) {} mark();
    units.forEach((u, i) => {
      const d = isDark(mode, u.dataset.screen);
      if (reduce.matches) return setDark(u, d);
      const sp = u.querySelectorAll('.spinner'), delay = i * 90;
      sp.forEach(x => { x.classList.remove('turn'); void x.offsetWidth; x.style.setProperty('--d', delay + 'ms'); x.classList.add('turn'); });
      setTimeout(() => setDark(u, d), delay + 450);
      setTimeout(() => sp.forEach(x => x.classList.remove('turn')), delay + 960);
    });
  }));

  /* 1920×1080 sahneyi pencereye sığdır */
  const fit = () => document.getElementById('stage').style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
